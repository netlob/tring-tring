[package]
name = "tring-tring"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
description = "Self-hosted iOS push notification service"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "macros"] }

thiserror = "1"
anyhow = "1"
dotenvy = "0.15"

# APNs (see ADR-0007)
a2 = "0.10"

# Rate limiting (see ADR-0008 + Step 6)
governor = "0.6"
dashmap = "6"

# Random secret generation
rand = "0.8"
base64 = "0.22"

# Notification name validation (ADR-0011)
regex = "1"
once_cell = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
